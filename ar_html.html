<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Hiro Hippo - Improved</title>
    <!-- นำเข้าไลบรารี A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- เปิดใช้ colorManagement เพื่อให้สีของโมเดล 3D สวยและสว่างขึ้นตามจริง -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true; colorManagement: true;">
      
      <!-- ============================================== -->
      <!-- 1. ปรับปรุงแสง (Lighting) ให้ฮิปโปดูสวยและมีมิติ -->
      <!-- ============================================== -->
      <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" color="#fffdf2" intensity="0.8" position="1 3 2"></a-light>
      <a-light type="directional" color="#e2e8f0" intensity="0.4" position="-1 1 -1"></a-light>

      <!-- ตั้งค่า Marker แบบ Hiro -->
      <a-marker preset="hiro">
        
        <!-- ============================================== -->
        <!-- 2. โมเดลฮิปโป (ปรับการหันหน้า) -->
        <!-- ============================================== -->
        <!-- 
          *หมายเหตุสำคัญ*: 
          - ตรง src="hippo.gltf" ให้คุณเปลี่ยนชื่อไฟล์ "hippo.gltf" เป็นชื่อไฟล์โมเดล 3D ที่อยู่ในโฟลเดอร์ของคุณ (เช่น scene.gltf, hippo.glb เป็นต้น)
          - ตรง rotation="-90 180 0" (แกน X, Y, Z) แกน Y คือ 180 จะทำให้โมเดลหันหน้าเข้าหากล้อง (หากยังไม่ตรงให้ลองเปลี่ยนเป็น 0, 90 หรือ 270 ดูครับ)
        -->
        <a-gltf-model 
          src="hippo.gltf" 
          position="0 0 0" 
          rotation="-90 180 0" 
          scale="1 1 1">
        </a-gltf-model>
        
      </a-marker>

      <!-- กล้อง -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
