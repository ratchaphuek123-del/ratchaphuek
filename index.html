<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Hiro - หน้าผอม / หน้าอ้วน</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }

    #status {
      position: fixed;
      z-index: 20;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,.60);
      padding: 9px 15px;
      border-radius: 14px;
      font-size: 14px;
      white-space: nowrap;
    }

    #buttons {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 22px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      color: white;
      background: rgba(20,20,20,.82);
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 5px 18px rgba(0,0,0,.3);
    }

    button:active { transform: scale(.96); }
  </style>
</head>

<body>
  <div id="status">กำลังเปิดกล้อง… หันกล้องไปที่ Hiro marker</div>

  <div id="buttons">
    <button id="slimBtn">😎 หน้าผอม</button>
    <button id="fatBtn">😊 หน้าอ้วน</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-marker preset="hiro" id="hiroMarker">
      <!-- ใช้สัดส่วนภาพจริง ไม่ยืดเป็นสี่เหลี่ยม -->
      <a-image
        id="face"
        src="./71066-face-slim.png"
        position="0 0.67 0"
        rotation="-90 0 0"
        width="0.90"
        height="1.125"
        material="transparent: true; alphaTest: 0.05;">
      </a-image>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("hiroMarker");
    const face = document.getElementById("face");
    const status = document.getElementById("status");
    const slimBtn = document.getElementById("slimBtn");
    const fatBtn = document.getElementById("fatBtn");

    marker.addEventListener("markerFound", () => {
      status.textContent = "พบ Hiro แล้ว 🎉";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "หันกล้องไปที่ Hiro marker";
    });

    function changeFace(image, message) {
      face.setAttribute("src", image);
      status.textContent = message;

      // เด้งเบา ๆ โดยไม่เปลี่ยนอัตราส่วนรูป
      face.setAttribute("animation__pop",
        "property: scale; from: 0.92 0.92 1; to: 1 1 1; dur: 220; easing: easeOutBack");
    }

    slimBtn.addEventListener("click", () => {
      changeFace("./71066-face-slim.png", "😎 เปลี่ยนเป็นหน้าผอมแล้ว");
    });

    fatBtn.addEventListener("click", () => {
      changeFace("./71066-face-fat.png", "😊 เปลี่ยนเป็นหน้าอ้วนแล้ว");
    });
  </script>
</body>
</html>
